name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 400

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          
          # Disable NLA (Network Level Authentication) - yeh zaroori hai
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          
          # Set Security Layer to RDP Security Layer
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 1 -Force

          # Firewall rules
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-TCP-In" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP-UDP-In" dir=in action=allow protocol=UDP localport=3389

          # Restart RDP Service
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 5

      - name: Create RDP User
        run: |
          $password = "TechZoner@001"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # Delete if exists
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
          }
          
          # Create new user
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          Write-Host "✅ User RDP created successfully"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Start-Sleep -Seconds 10

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=win-11
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 3
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned"
              exit 1
          }
          
          Write-Host "✅ Tailscale IP: $tsIP"
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Test RDP Port
        run: |
          Write-Host "`n=== RDP CONNECTION DETAILS ==="
          Write-Host "IP Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==============================`n"
          
          # Test if RDP port is open
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if ($testResult.TcpTestSucceeded) {
              Write-Host "✅ RDP Port 3389 is OPEN and accessible"
          } else {
              Write-Host "❌ RDP Port 3389 is NOT accessible"
              exit 1
          }

      - name: Keep Alive
        run: |
          Write-Host "`n🚀 RDP is READY! Connect now using:"
          Write-Host "   IP: $env:TAILSCALE_IP"
          Write-Host "   User: RDP"
          Write-Host "   Pass: $env:RDP_PASSWORD"
          Write-Host "`n⏳ Keeping connection alive..."
          
          while ($true) {
              Write-Host "[$(Get-Date)] Active - IP: $env:TAILSCALE_IP"
              Start-Sleep -Seconds 60
          }
